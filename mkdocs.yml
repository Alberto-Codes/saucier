site_name: saucier
site_description: Structured procedure extraction from culinary sources.
site_url: https://alberto-codes.github.io/saucier/
repo_url: https://github.com/Alberto-Codes/saucier
repo_name: Alberto-Codes/saucier
copyright: "Copyright &copy; 2026 Alberto-Codes &mdash; MIT License"

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  palette:
    # `custom` stops Material emitting its own colour rules, which are written
    # with a two-attribute selector that outranks anything in `theme.css`.
    # Without it the slate link colour stays Material indigo on a wine site.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - navigation.instant
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - announce.dismiss

extra_css:
  - stylesheets/theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Alberto-Codes/saucier
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/saucier/

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            modernize_annotations: true
            line_length: 88
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            # Category headings put "Attributes", "Classes" and
            # "Methods:" into the table of contents beside the symbols
            # themselves, which buries the names a reader is looking
            # for. The symbol badges already name each kind.
            show_category_heading: false
            merge_init_into_class: true
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true

nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
      - First run: tutorial/first-run.md
  - How-to:
      - how-to/index.md
      - Add a source: how-to/add-a-source.md
      - Cut a release: how-to/cut-a-release.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Data model: reference/data-model.md
      - Glossary: reference/glossary.md
      - API: reference/api/
  - Explanation:
      - explanation/index.md
      - Why no model yet: explanation/why-no-model-yet.md
      - Why the layers: explanation/hexagon.md
  - Decisions:
      - adr/index.md
      - ADR-0001 Documentation stack: adr/0001-docs-stack.md
      - ADR-0002 Unresolved is not none: adr/0002-unresolved-is-not-none.md
      - ADR-0003 Terms are never translated: adr/0003-terms-are-never-translated.md
      - ADR-0004 Corpus and derived data: adr/0004-corpus-is-committed-data-is-derived.md
      - ADR-0005 Layers and dependencies: adr/0005-hexagon-and-no-runtime-dependencies.md
      - ADR-0006 Storage in stages: adr/0006-storage-arrives-in-stages.md
      - ADR-0007 The source classifies itself: adr/0007-the-source-classifies-its-own-contents.md

markdown_extensions:
  - abbr
  - def_list
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      # Resolved against the project root, not docs_dir.
      base_path: [docs]
      auto_append:
        - includes/abbreviations.md
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Without this a ```mermaid block renders as a plain code listing on
        # the site. GitHub renders the same block natively, so one source
        # has to satisfy both renderers.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      # Emits a `.language-<lang>` class on the wrapper, which the stylesheet
      # uses to mark console output as the evidence it is.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
